 <section class="lesson-panel"><h2>Apa Itu Pranata Mangsa?</h2>
 <p><span class="highlight">Pranata Mangsa</span> adalah sistem penanggalan tradisional masyarakat Jawa yang membagi satu tahun menjadi <span class="highlight">12 mangsa</span> atau periode. Kata <em>pranata</em> berarti aturan, sedangkan <em>mangsa</em> berarti waktu atau musim.</p>
 <p>Pranata Mangsa digunakan sebagai pedoman untuk mengenali perubahan musim dan menentukan waktu kegiatan pertanian, seperti menanam dan memanen.</p>
 <p>Sistem ini menggunakan siklus tahunan Matahari serta pengamatan tanda alam, seperti cuaca, arah angin, tumbuhan, dan perilaku hewan.</p></section>
 <section class="lesson-panel"><h2>Sejarah Singkat</h2><p>Pengetahuan tentang Pranata Mangsa digunakan secara turun-temurun oleh masyarakat Jawa. Sistem penanggalan ini kemudian dibakukan pada masa pemerintahan <span class="highlight">Pakubuwono VII di Surakarta pada abad ke-19.</span></p><p>Pembakuannya bertujuan memberikan pedoman waktu bagi masyarakat, terutama petani, dalam mengatur kegiatan pertanian.</p></section>
 <section class="lesson-panel"><h2>Mengapa Penting?</h2><p>Pranata Mangsa menunjukkan bagaimana masyarakat Jawa mempelajari alam melalui pengamatan dan pengalaman. Pengetahuan ini membantu manusia menyesuaikan kegiatan dengan lingkungan sekaligus mengajarkan pentingnya menjaga hubungan yang baik dengan alam.</p><div class="callout">✨ <strong>Ingat!</strong> Pranata Mangsa adalah pengetahuan budaya berbasis pengamatan alam, bukan alat untuk memastikan cuaca pada setiap tanggal.</div></section>`},
 {id:'kalender',icon:'🗓️',title:'Kalender 12 Mangsa',short:'Klik dan jelajahi 12 periode',sub:'Setiap mangsa memiliki waktu, tanda alam, dan kegiatan pertanian yang khas.',body:`
 <section class="lesson-panel"><h2>Apa Saja 12 Mangsa?</h2><p>Satu tahun Pranata Mangsa dibagi menjadi <span class="highlight">12 periode dengan jumlah hari berbeda.</span> Setiap mangsa memiliki ciri alam yang dahulu digunakan sebagai petunjuk dalam kehidupan masyarakat Jawa.</p><p><strong>Pilih salah satu mangsa</strong> untuk membaca tanggal dan ciri-cirinya:</p>
 <div class="mangsa-picker" id="mangsa-picker"></div><div class="mangsa-detail" id="mangsa-detail" aria-live="polite"></div>
 <div class="sub-note">Tanggal mengikuti pembagian kalender Pranata Mangsa tradisional dalam buku BRIN. Ciri-ciri alamnya menggambarkan pengamatan tradisional, bukan prakiraan cuaca yang pasti di setiap tempat atau tahun.</div></section>
 <section class="lesson-panel"><h2>Empat Periode Musim dalam Pranata Mangsa</h2><p>Dalam kalender tradisional ini, 12 mangsa dikelompokkan menjadi empat periode yang berkaitan dengan kegiatan pertanian masyarakat Jawa:</p><div class="season-grid">
 <div class="season-card"><h3>☀️ Mangsa Ketiga</h3><div class="subset">Kasa • Karo • Katelu</div><p>Periode kering atau kemarau.</p></div>
 <div class="season-card"><h3>🌦️ Mangsa Labuh</h3><div class="subset">Kapat • Kalima • Kanem</div><p>Peralihan dari kemarau ke musim hujan.</p></div>
 <div class="season-card"><h3>🌧️ Mangsa Rendheng</h3><div class="subset">Kapitu • Kawolu • Kasanga</div><p>Periode musim hujan.</p></div>
 <div class="season-card"><h3>🌱 Mangsa Mareng</h3><div class="subset">Kasadasa • Dhesta • Sadha</div><p>Peralihan dari musim hujan menuju kemarau.</p></div></div>
 <div class="callout">🔎 <strong>Perlu diingat:</strong> Ke-12 mangsa adalah bagian kalender tradisional, <em>bukan</em> 12 musim meteorologis. Di banyak wilayah Indonesia dikenal musim hujan dan kemarau, tetapi waktu dan pola hujannya dapat berbeda menurut daerah serta tahun.</div></section>`},
 {id:'tanda',icon:'🌿',title:'Membaca Tanda Alam',short:'Tumbuhan, hewan, cuaca',sub:'Belajar mengenali pola perubahan alam seperti masyarakat Jawa dahulu.',body:`
 <section class="lesson-panel"><h2>Apa Itu Ilmu Titen?</h2><p>Sebelum ada teknologi prakiraan cuaca modern, masyarakat Jawa mengamati perubahan alam yang berulang kali terjadi.</p><p>Kebiasaan <span class="highlight">mengamati, mengingat, dan mengenali pola kejadian alam</span> ini dikenal sebagai <em>ilmu titen</em>. Hasil pengamatan membantu masyarakat memperkirakan perubahan lingkungan.</p></section>
 <section class="lesson-panel"><h2>Tanda-Tanda Apa yang Diamati?</h2><div class="info-grid">
 <div class="info-card"><span class="pict">🍃</span><h3>1. Tumbuhan</h3><p>Daun dapat berguguran saat kondisi kering. Tunas baru dapat muncul ketika lingkungan mulai lebih basah.</p></div>
 <div class="info-card"><span class="pict">🐦</span><h3>2. Hewan</h3><p>Perilaku hewan diamati, misalnya burung yang mulai membuat sarang atau suara tonggeret pada waktu tertentu.</p></div>
 <div class="info-card"><span class="pict">🌧️</span><h3>3. Cuaca dan Angin</h3><p>Perubahan angin, hujan, suhu, keadaan tanah, dan sumber air menjadi petunjuk kondisi lingkungan.</p></div>
 <div class="info-card"><span class="pict">✨</span><h3>4. Benda Langit</h3><p>Matahari dan kelompok bintang tertentu diamati sebagai petunjuk waktu kegiatan sehari-hari.</p></div></div></section>
 <section class="lesson-panel"><h2>Apakah Tanda Alam Selalu Tepat?</h2><p><strong>Tidak selalu.</strong> Tanda alam adalah petunjuk berdasarkan pola yang pernah diamati, bukan jaminan suatu kejadian akan berlangsung pada tanggal tertentu.</p><div class="callout">💡 Pengamatan tradisional dapat dipadukan dengan data cuaca dan iklim modern agar keputusan yang dibuat lebih sesuai dengan kondisi saat ini.</div></section>`},
 {id:'langit',icon:'🌌',title:'Langit & Pranata Mangsa',short:'Matahari dan perbintangan Jawa',sub:'Mengenal hubungan antara pengamatan langit dan penentuan waktu.',body:`
 <section class="lesson-panel"><h2>Apa Hubungannya dengan Astronomi?</h2><p><span class="highlight">Astronomi</span> adalah ilmu yang mempelajari benda-benda langit dan fenomena yang berkaitan dengannya.</p><p>Pranata Mangsa berkaitan dengan astronomi karena menggunakan siklus tahunan Matahari dan pengamatan kelompok bintang sebagai petunjuk waktu.</p></section>
 <section class="lesson-panel"><h2>Peran Matahari</h2><p>Kalender Pranata Mangsa menggunakan siklus tahunan Matahari sebagai dasar pembagian waktunya.</p><p>Jika dilihat dari Bumi, posisi tampak Matahari berubah sepanjang tahun. Fenomena ini disebut <span class="highlight">gerak semu tahunan Matahari</span>.</p><p>Gerak semu tahunan tersebut terjadi akibat revolusi Bumi mengelilingi Matahari dan kemiringan sumbu rotasi Bumi.</p><p>Masyarakat Jawa dahulu mengamati perubahan posisi Matahari serta arah dan panjang bayangan sebagai petunjuk perjalanan waktu.</p><div class="callout">☀️ Matahari <strong>tampak</strong> bergeser sepanjang tahun jika diamati dari Bumi. Ini bukan berarti Matahari mengelilingi Bumi.</div></section>
 <section class="lesson-panel"><h2>Mengenal Perbintangan Jawa</h2><p>Dalam tradisi Jawa, pengamatan benda langit dikenal dengan istilah <em>palintangan</em>. Beberapa pola bintang diberi nama berdasarkan bentuk yang dibayangkan masyarakat.</p><p><strong>Ketuk nama berikut untuk mengenalinya:</strong></p><div class="astro-picker" id="astro-picker"></div><div class="astro-detail" id="astro-detail" aria-live="polite"></div></section>
 <section class="lesson-panel"><h2>Apakah Bintang Menyebabkan Musim?</h2><p><strong>Tidak.</strong> Kelompok bintang tersebut tidak menyebabkan hujan atau pergantian musim. Perubahan kenampakannya di langit sepanjang tahun dapat digunakan sebagai <span class="highlight">penanda waktu</span>.</p><p>Di banyak wilayah Indonesia, pergantian musim hujan dan kemarau terutama berkaitan dengan perubahan <span class="highlight">angin monsun</span>, kondisi atmosfer, dan laut. Waktu serta pola musim dapat berbeda antardaerah.</p><div class="callout">🔎 <strong>Bedakan dua hal:</strong> Gerak semu tahunan Matahari dijelaskan melalui revolusi Bumi dan kemiringan sumbunya. Sementara itu, banyak-sedikitnya hujan di suatu wilayah juga dipengaruhi oleh pola angin serta kondisi atmosfer dan laut.</div></section>`},
 {id:'kehidupan',icon:'🌏',title:'Pranata Mangsa Hari Ini',short:'Pertanian dan sains modern',sub:'Menghubungkan pengetahuan tradisional dengan keputusan masa kini.',body:`
 <section class="lesson-panel"><h2>Bagaimana Pranata Mangsa Digunakan?</h2><p>Pranata Mangsa berperan dalam kehidupan masyarakat Jawa, terutama pada bidang pertanian. Petani menggunakannya sebagai pedoman memperkirakan waktu mengolah tanah, menanam, merawat tanaman, dan memanen.</p><p>Ketika air cukup pada musim hujan, petani dapat menanam padi. Saat air lebih terbatas, mereka dapat memilih palawija yang sesuai dengan kondisi lahan.</p><p>Selain pertanian, Pranata Mangsa juga dikenal sebagai pedoman tradisional bagi sebagian nelayan untuk memperkirakan kondisi alam terkait kegiatan melaut.</p></section>
 <section class="lesson-panel"><h2>Masih Dapat Digunakan?</h2><p>Pranata Mangsa tetap penting sebagai pengetahuan dan warisan budaya masyarakat Jawa.</p><p>Namun, pola musim sekarang tidak selalu sama dengan pola yang diamati pada masa lalu. Perubahan iklim serta fenomena <span class="highlight">El Niño dan La Niña</span> dapat memengaruhi curah hujan.</p><div class="callout">🌾 Pranata Mangsa sebaiknya menjadi <strong>pengetahuan pendukung</strong>, bukan satu-satunya pedoman dalam menentukan waktu tanam.</div></section>
 <section class="lesson-panel"><h2>Kearifan Lokal + Sains Modern</h2><p>Petani dapat memadukan pengamatan tanda alam dengan informasi cuaca dan iklim dari <span class="highlight">BMKG</span> (Badan Meteorologi, Klimatologi, dan Geofisika).</p><p>Dengan demikian, pengetahuan tradisional tetap dapat dilestarikan, sementara keputusan pertanian dibuat berdasarkan kondisi lingkungan dan informasi ilmiah yang tersedia.</p></section>
 <section class="lesson-panel"><h2>Apa yang Bisa Kita Pelajari?</h2><p>Pranata Mangsa mengajarkan bahwa manusia, tumbuhan, hewan, cuaca, dan lingkungan saling berkaitan. Melalui pengamatan alam, kita belajar memahami pola perubahan dan hubungan antarkomponen lingkungan serta menggunakannya untuk memecahkan masalah.</p></section>
 <section class="lesson-panel"><h2>Uji Pemahamanmu!</h2><p class="quiz-question">Apakah munculnya Lintang Waluku menyebabkan musim hujan?</p><div class="quiz-buttons"><button class="quiz-option" data-answer="wrong" type="button">Ya, menyebabkan hujan</button><button class="quiz-option" data-answer="right" type="button">Tidak, hanya penanda waktu</button></div><div class="quiz-result" id="quiz-result" aria-live="polite" hidden></div></section>
 <section class="lesson-panel"><h2>Rangkuman Penjelajahan</h2><p>Pranata Mangsa menunjukkan bahwa pengamatan langit, cuaca, hewan, dan tumbuhan dapat membantu manusia memahami pola perubahan alam.</p><p>Pengetahuan tradisional ini penting untuk dilestarikan. Untuk mengambil keputusan saat ini, hasil pengamatan alam perlu dipadukan dengan informasi ilmiah yang terbaru.</p><div class="callout">🌟 <strong>Kamu telah menyelesaikan lima bagian Pustaka Mangsa!</strong> Kamu dapat mengulang materi atau mengeksplorasi kembali kalender dan perbintangan Jawa melalui daftar materi.</div></section>`}
];
let page=-1,mangsa=0,astro=0;
const screen=document.getElementById('screen'),scroller=document.getElementById('scroller'),count=document.getElementById('count-label'),backBtn=document.getElementById('back-btn');
const arrow='\u2192';
function sourceFooter(){return `<div class="small-source"><strong>Rujukan utama:</strong> Handayani, R. D., Prasetyo, Z. K., &amp; Wilujeng, I. (2023). <em>Pranata Mangsa dalam Tinjauan Sains</em> (edisi revisi). Penerbit BRIN. DOI: 10.55981/brin.691.<br><strong>Pengayaan konsep sains:</strong> BMKG (pola monsun dan variasi musim hujan–kemarau di Indonesia); NASA Earth Observatory (revolusi Bumi dan kemiringan sumbu Bumi).<br><strong>Catatan:</strong> Ciri setiap mangsa merupakan penanda tradisional, bukan prakiraan cuaca pasti pada setiap tempat dan tahun.</div>`;}
function home(){return `<div class="page"><div class="home-hero"><span class="eyebrow">✧ Pustaka Pengetahuan ✧</span><h1>Jelajah Pranata Mangsa</h1><p>Kenali kearifan lokal Jawa dalam membaca alam dan langit. Pilih satu bagian untuk memulai penjelajahan bersama Tata dan Surya!</p><div class="hero-divider"></div></div><div class="portal-grid">${sections.map((s,i)=>`<button type="button" class="portal-card" data-go="${i}"><span class="number">BAGIAN ${String(i+1).padStart(2,'0')}</span><span class="orb" aria-hidden="true">${s.icon}</span><strong>${s.title}</strong><small>${s.short}</small></button>`).join('')}</div><div class="intro-note"><span class="bulb" aria-hidden="true">💡</span><div><strong>Petunjuk jelajah:</strong> Klik salah satu gelembung untuk membaca materi. Pada Kalender 12 Mangsa dan Perbintangan Jawa, kamu dapat memilih bagian yang ingin dipelajari.</div></div><div class="home-footer"><span>🌟 Pelajari alam • Kenali budaya • Pahami langit</span><span>PETASA • IPA Kelas VII</span></div>${sourceFooter()}</div>`}
function lesson(idx){const s=sections[idx];return `<div class="page"><div class="lesson-head"><span class="eyebrow">${s.icon} BAGIAN ${String(idx+1).padStart(2,'0')} / 05</span><h1>${s.title}</h1><p>${s.sub}</p><div class="progress" aria-hidden="true">${sections.map((_,i)=>`<span class="progress-dot ${idx===i?'active':''}"></span>`).join('')}</div></div><div class="lesson-layout"><nav class="side-menu" aria-label="Daftar materi"><strong>Daftar Materi</strong>${sections.map((t,i)=>`<button type="button" data-go="${i}" class="${idx===i?'active':''}" ${idx===i?'aria-current="page"':''}><span>${String(i+1).padStart(2,'0')}</span>${t.title}</button>`).join('')}</nav><div class="lesson-content">${s.body}<div class="bottom-nav"><button type="button" class="nav-button" data-go="${idx===0?-1:idx-1}">← ${idx===0?'Menu Materi':'Sebelumnya'}</button><button type="button" class="nav-button next" ${idx===sections.length-1?'data-go="-1"':`data-go="${idx+1}"`}>${idx===sections.length-1?'Kembali ke Menu':`Selanjutnya ${arrow}`}</button></div>${sourceFooter()}</div></div></div>`}
function render(p){page=p;document.title=(p===-1?'Jelajah Pranata Mangsa':sections[p].title)+' | PETASA';count.textContent=p===-1?'PUSTAKA INTERAKTIF • 5 BAGIAN':`BAGIAN ${p+1} DARI 5`;backBtn.hidden=p===-1;screen.innerHTML=p===-1?home():lesson(p);if(p===1)renderMangsa();if(p===3)renderAstro();scroller.scrollTop=0;}
function renderMangsa(){const picker=document.getElementById('mangsa-picker');if(!picker)return;picker.innerHTML=seasonData.map((s,i)=>`<button type="button" class="mangsa-button ${mangsa===i?'active':''}" data-mangsa="${i}" aria-pressed="${mangsa===i}"><span>${String(i+1).padStart(2,'0')}</span>${s[0]}</button>`).join('');const d=seasonData[mangsa];document.getElementById('mangsa-detail').innerHTML=`<span class="category">Kelompok: Mangsa ${d[2]}</span><h3>${mangsa+1}. Mangsa ${d[0]}</h3><div class="period">📅 ${d[1]}</div><p>${d[3]}</p>`;}
function renderAstro(){const picker=document.getElementById('astro-picker');if(!picker)return;picker.innerHTML=astroData.map((s,i)=>`<button type="button" class="astro-button ${astro===i?'active':''}" data-astro="${i}" aria-pressed="${astro===i}">${s.name}</button>`).join('');const d=astroData[astro];document.getElementById('astro-detail').innerHTML=`<h3>✦ ${d.name} — ${d.modern}</h3><p>${d.info}</p>`;}
backBtn.addEventListener('click',()=>render(-1));
screen.addEventListener('click',(e)=>{
 const el=e.target.closest('button');if(!el)return;
 if(el.hasAttribute('data-go')){render(Number(el.dataset.go));return;}
 if(el.hasAttribute('data-mangsa')){mangsa=Number(el.dataset.mangsa);renderMangsa();return;}
 if(el.hasAttribute('data-astro')){astro=Number(el.dataset.astro);renderAstro();return;}
 if(el.hasAttribute('data-answer')){
   const good=el.dataset.answer==='right',result=document.getElementById('quiz-result');
   result.hidden=false;
   result.textContent=good?'✅ Tepat! Lintang Waluku merupakan penanda waktu berdasarkan kenampakannya di langit, bukan penyebab hujan.':'💡 Coba perhatikan kembali. Lintang Waluku tidak menyebabkan hujan; kelompok bintang ini digunakan sebagai petunjuk waktu berdasarkan pengamatan langit.';
 }
});
// Bintang di latar menggunakan susunan tetap agar stabil di setiap muat halaman.
const sky=document.getElementById('sky');let seed=73;function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}for(let i=0;i<100;i++){const st=document.createElement('i');st.className='star'+(i%11===0?' cross':'');const sz=i%11===0?4:1+Math.round(random()*2);st.style.cssText=`left:${random()*100}%;top:${random()*93}%;width:${sz}px;height:${sz}px;opacity:${.3+random()*.6};animation-delay:${random()*4}s;animation-duration:${2.3+random()*3.3}s`;sky.appendChild(st)}
render(-1);
})();
</script>
